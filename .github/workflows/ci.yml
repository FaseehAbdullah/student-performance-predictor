name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:

      # Step 1 — Check out the code
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2 — Set up Python
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      # Step 3 — Cache pip dependencies
      # If requirements.txt hasn't changed, restores from cache
      # Saves 1–2 minutes on every run
      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # Step 4 — Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      # Step 5 — Create dummy model artifacts
      # CI doesn't have access to real .pkl files (they are in DVC / local)
      # We create minimal dummy artifacts so the import doesn't crash
      - name: Create dummy model artifacts
        run: |
          python - <<'EOF'
          import joblib
          import numpy as np
          import os
          from sklearn.ensemble import RandomForestClassifier
          from sklearn.preprocessing import StandardScaler, LabelEncoder

          os.makedirs("models", exist_ok=True)

          # Dummy model
          clf = RandomForestClassifier(n_estimators=2, random_state=42)
          X_dummy = np.random.rand(20, 39)
          y_dummy = np.array(["A","B","C","D","F"] * 4)
          clf.fit(X_dummy, y_dummy)
          joblib.dump(clf, "models/best_model.pkl")

          # Dummy preprocessor
          scaler = StandardScaler()
          scaler.fit(X_dummy[:, :13])
          num_cols = [
              "age", "Medu", "Fedu", "traveltime", "studytime",
              "failures", "famrel", "freetime", "goout",
              "Dalc", "Walc", "health", "absences"
          ]
          # Feature cols must match what main.py expects
          feature_cols = num_cols + [
              "sex", "address", "famsize", "Pstatus",
              "schoolsup", "famsup", "paid", "activities",
              "nursery", "higher", "internet", "romantic",
              "school_MS",
              "Mjob_health", "Mjob_other", "Mjob_services", "Mjob_teacher",
              "Fjob_health", "Fjob_other", "Fjob_services", "Fjob_teacher",
              "reason_home", "reason_other", "reason_reputation",
              "guardian_mother", "guardian_other"
          ]
          preprocessor = {
              "scaler"       : scaler,
              "num_cols"     : num_cols,
              "feature_cols" : feature_cols
          }
          joblib.dump(preprocessor, "models/preprocessor.pkl")

          # Dummy label encoder
          le = LabelEncoder()
          le.fit(["A", "B", "C", "D", "F"])
          joblib.dump(le, "models/label_encoder.pkl")

          print("Dummy artifacts created successfully.")
          EOF

      # Step 6 — Run pytest
      - name: Run tests
        run: |
          pytest tests/ -v --tb=short